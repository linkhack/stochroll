version: 2

updates:
  # pyproject.toml and uv.lock
  - package-ecosystem: "uv"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Vienna"

    # Keep existing constraints when they already allow the update.
    # Change pyproject.toml only when necessary.
    versioning-strategy: "increase-if-necessary"

    open-pull-requests-limit: 5

    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Actions referenced in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Vienna"

    open-pull-requests-limit: 3

    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "ci"
