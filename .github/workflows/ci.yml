name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    name: Required checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type-check
        run: uv run --no-sync mypy src

      - name: Run tests
        run: uv run --no-sync pytest --cov=stochroll --cov-report=term-missing

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          WHEEL="$(find dist -name '*.whl' -print -quit)"

          if [ -z "$WHEEL" ]; then
            echo "No wheel found in dist/"
            exit 1
          fi

          uv venv .venv-wheel-test --python 3.12

          uv pip install \
            --python .venv-wheel-test/bin/python \
            "$WHEEL"

          cd "$RUNNER_TEMP"

          "$GITHUB_WORKSPACE/.venv-wheel-test/bin/python" - <<'PY'
          import stochroll
          from stochroll import Event, Pool, Roll, Roller, where

          roller = Roller(repetitions=1_000, seed=42)
          result = roller.pool(4, d=6).drop_lowest().sum()

          assert result.values.shape == (1_000,)
          assert result.values.min() >= 3
          assert result.values.max() <= 18

          print("Imported from:", stochroll.__file__)
          print("Expected value:", result.expected())
          PY

  compatibility:
    name: >-
      ${{ matrix.os }} /
      Python ${{ matrix.python-version }} /
      NumPy ${{ matrix.numpy-version }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

        numpy-version:
          - minimum
          - latest

        exclude:
          # Test the minimum NumPy version only once:
          # Ubuntu with the oldest supported Python.
          - os: windows-latest
            numpy-version: minimum

          - os: macos-latest
            numpy-version: minimum

          - python-version: "3.13"
            numpy-version: minimum

          - python-version: "3.14"
            numpy-version: minimum

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install minimum NumPy
        if: matrix.numpy-version == 'minimum'
        run: uv pip install "numpy==1.26.*"

      - name: Install latest compatible NumPy
        if: matrix.numpy-version == 'latest'
        run: uv pip install --upgrade "numpy>=1.26"

      - name: Show tested versions
        run: >-
          uv run --no-sync python -c
          "import platform, numpy;
          print('OS:', platform.platform());
          print('Python:', platform.python_version());
          print('NumPy:', numpy.__version__)"

      - name: Verify minimum NumPy version
        if: matrix.numpy-version == 'minimum'
        run: >-
          uv run --no-sync python -c
          "import numpy;
          assert numpy.__version__.startswith('1.26.'), numpy.__version__"

      - name: Run compatibility tests
        run: uv run --no-sync pytest

  compatibility-summary:
    name: Compatibility checks
    runs-on: ubuntu-latest
    needs:
      - compatibility

    if: always()

    steps:
      - name: Check compatibility matrix result
        shell: bash
        run: |
          if [ "${{ needs.compatibility.result }}" != "success" ]; then
            echo "At least one compatibility job failed."
            exit 1
          fi

          echo "All compatibility jobs passed."
