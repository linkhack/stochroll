name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not part of main."
            exit 1
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Verify tag matches project version
        shell: bash
        run: |
          PROJECT_VERSION="$(uv version --short)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Project version: $PROJECT_VERSION"
          echo "Tag version:     $TAG_VERSION"

          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "The Git tag does not match pyproject.toml."
            exit 1
          fi

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distributions
        run: uv run --no-sync twine check dist/*

      - name: Smoke-test wheel
        shell: bash
        run: |
          WHEEL="$(find dist -name '*.whl' -print -quit)"

          if [ -z "$WHEEL" ]; then
            echo "No wheel found in dist/."
            exit 1
          fi

          uv venv .venv-wheel-test --python 3.12

          uv pip install \
            --python .venv-wheel-test/bin/python \
            "$WHEEL"

          cd "$RUNNER_TEMP"

          "$GITHUB_WORKSPACE/.venv-wheel-test/bin/python" - <<'PY'
          import stochroll
          from stochroll import Roller

          roller = Roller(repetitions=1_000, seed=42)
          result = roller.pool(4, d=6).drop_lowest().sum()

          assert result.values.shape == (1_000,)
          assert result.values.min() >= 3
          assert result.values.max() <= 18

          print("Imported from:", stochroll.__file__)
          print("Expected value:", result.expected())
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    runs-on: ubuntu-latest
    needs:
      - build

    environment:
      name: pypi
      url: https://pypi.org/p/stochroll

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
