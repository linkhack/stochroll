  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - publish

    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "StochRoll ${VERSION}" \
            --generate-notes
